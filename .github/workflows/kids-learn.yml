name: Belajar Ceria (kids app)

on:
  push:
    paths:
      - "kids-learn/**"
      - ".github/workflows/kids-learn.yml"
  pull_request:
    paths:
      - "kids-learn/**"
      - ".github/workflows/kids-learn.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build the APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Release build
        working-directory: kids-learn
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Name the APK
        run: |
          cp kids-learn/app/build/outputs/apk/release/app-release.apk belajar-ceria.apk
          echo "APK: $(( $(stat -c %s belajar-ceria.apk) / 1024 )) KB"
      - uses: actions/upload-artifact@v4
        with:
          name: belajar-ceria-apk
          path: belajar-ceria.apk

  screenshots:
    name: Run it on an emulator
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the screenshots on their own branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: belajar-ceria-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open every screen and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: sh kids-learn/tools/screenshots.sh belajar-ceria.apk shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: belajar-ceria-screenshots
          path: shots/
      - name: Publish the screenshots on the kids-learn-screenshots branch
        if: github.event_name == 'push'
        run: |
          cd shots
          git init -q -b kids-learn-screenshots
          git add *.png
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Screenshots of ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:kids-learn-screenshots
